<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
        }
        a:visited{
            color:darkred;
        }
        a:hover{
            color:blue;
            text-decoration: yellow;
        }
        a:active{
            color: green;
        }
    </style>

</head>
<body>
