<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body style="background-color: lightblue;">
    <h1 style="font-family: Arial, Helvetica, sans-serif;">Inserindo videos localmente</h1>
    <p style="font-family: Arial, Helvetica, sans-serif;">Este video esta hospedsndo em meu proprio servidor</p>
    <video width="500" poster="imagem/paisagem-new.jpg" controls autoplay loop>
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-videowebm.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidade com reprodução de video.</p>
    </video>
    <h1 style="font-family: Arial, Helvetica, sans-serif;">Inserindo videos do Youtube</h1>
    <iframe width="500" height="315" src="https://www.youtube.com/embed/0sClT_AIiXg?si=4AnAHjRliOtbcUpi" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
